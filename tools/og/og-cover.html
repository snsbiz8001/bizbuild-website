<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ── OG 공유 카드 원본 (1200×630) ──
     brand.md 표준 준수: 네이비 #152C5B / 골드 #D4AF5F / 라벨골드 #E0BD6E
     다크배경 판정 3색: 진행 #2FA57C / 보류 #E8AB45 / 중단 #D65C5C
     제목 Noto Serif KR / 본문 Noto Sans KR
     이 파일을 고쳐 tools/og/render.js 로 다시 렌더하면 images/og-cover.jpg 가 갱신된다. */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  .card{
    position:relative;width:1200px;height:630px;
    background:#152C5B;
    display:flex;flex-direction:column;
    padding:64px 72px;
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 골드 방사형 글로우(사이트 히어로와 동일 톤) */
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 26% 34%,rgba(212,175,95,0.13) 0%,transparent 66%);}
  /* 세로 골드 그리드 라인(히어로 모티프) */
  .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(212,175,95,0.03) 79px,rgba(212,175,95,0.03) 80px);}
  /* 상단 골드 테두리 액센트 */
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#D4AF5F 0%,#E0BD6E 50%,#D4AF5F 100%);}

  .brand{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;}
  .brand-logo{font-family:'Noto Serif KR',serif;font-weight:900;font-size:40px;color:#D4AF5F;letter-spacing:0.5px;}
  .brand-sub{font-size:19px;font-weight:700;color:#E0BD6E;letter-spacing:0.14em;}

  .center{position:relative;z-index:2;flex-grow:1;display:flex;flex-direction:column;justify-content:center;}
  .kicker{font-size:24px;font-weight:700;color:#A8B2C4;letter-spacing:0.02em;margin-bottom:22px;}
  .headline{font-family:'Noto Serif KR',serif;font-weight:900;line-height:1.16;letter-spacing:-0.5px;}
  .headline .l1{display:block;font-size:78px;color:#FFFFFF;}
  .headline .l2{display:block;font-size:112px;color:#D4AF5F;}

  .badges{position:relative;z-index:2;display:flex;gap:20px;align-items:center;margin-top:40px;}
  .badge{
    display:inline-flex;align-items:center;gap:12px;
    padding:13px 30px 15px;border-radius:999px;
    font-size:29px;font-weight:800;letter-spacing:0.02em;
    border:2px solid;background:rgba(255,255,255,0.03);
  }
  .badge .dot{width:15px;height:15px;border-radius:50%;}
  .b-go{color:#2FA57C;border-color:#2FA57C;}      .b-go  .dot{background:#2FA57C;}
  .b-hold{color:#E8AB45;border-color:#E8AB45;}    .b-hold .dot{background:#E8AB45;}
  .b-stop{color:#D65C5C;border-color:#D65C5C;}    .b-stop .dot{background:#D65C5C;}

  .url{position:absolute;right:72px;bottom:56px;z-index:2;font-size:24px;font-weight:700;color:#E0BD6E;letter-spacing:0.06em;}
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="brand">
      <div class="brand-logo">BizBuild</div>
      <div class="brand-sub">비즈빌드 사업설계전략연구소</div>
    </div>

    <div class="center">
      <div class="kicker">돈을 넣기 전에 먼저 — 창업생존지수 BSI</div>
      <div class="headline">
        <span class="l1">감이 아니라,</span>
        <span class="l2">설계입니다</span>
      </div>
      <div class="badges">
        <span class="badge b-go"><span class="dot"></span>진행</span>
        <span class="badge b-hold"><span class="dot"></span>보류</span>
        <span class="badge b-stop"><span class="dot"></span>중단</span>
      </div>
    </div>

    <div class="url">bizbuild.kr</div>
  </div>
</body>
</html>
