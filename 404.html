<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 비즈빌드</title>
<meta name="robots" content="noindex">

<!-- 파비콘 -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--navy:#152C5B;--gold:#D4AF5F;--gold-light:#E8CB82;--gray:#D8DEE8;--cta-blue:#2E9BD6;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--navy);color:#FFFFFF;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 5%;text-align:center;
}
.bg{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(212,175,95,0.08) 0%,transparent 70%);
}
.inner{position:relative;z-index:2;max-width:520px;}
.brand{
  font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:28px;color:var(--gold);letter-spacing:0.2px;
  text-decoration:none;display:inline-block;margin-bottom:44px;
}
.code{
  font-family:'Noto Serif KR',serif;font-weight:900;
  font-size:clamp(64px,14vw,104px);color:var(--gold);
  line-height:1;margin-bottom:20px;
}
h1{
  font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:clamp(21px,4vw,28px);line-height:1.4;
  letter-spacing:-0.5px;margin-bottom:18px;
  word-break:keep-all;
}
p{
  font-size:16px;line-height:1.8;color:var(--gray);
  margin-bottom:40px;word-break:keep-all;
}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:15px 30px;border-radius:4px;
  font-size:15px;font-weight:700;text-decoration:none;
  transition:background 0.2s,border-color 0.2s;
}
.btn-main{background:var(--cta-blue);color:#FFFFFF;}
.btn-main:hover{background:#2589BE;}
.btn-sub{border:1px solid rgba(212,175,95,0.4);color:var(--gold);font-weight:500;}
.btn-sub:hover{border-color:var(--gold);background:rgba(212,175,95,0.08);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="inner">
  <a href="/" class="brand">BizBuild</a>
  <div class="code">404</div>
  <h1>요청하신 페이지를<br>찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>아래에서 필요한 곳으로 이동하실 수 있습니다.</p>
  <div class="btns">
    <a href="/" class="btn btn-main">홈으로 가기</a>
    <a href="https://quiz.bizbuild.kr" target="_blank" rel="noopener" class="btn btn-sub">무료 창업판정 받기</a>
  </div>
</div>
<script src="/assets/track.js" defer></script>
</body>
</html>
